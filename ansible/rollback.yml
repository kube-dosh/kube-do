---
- name: Stop Kubernetes and restore the target Build configuration
  hosts: k8s_cluster
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Inspect the rollback archive
      ansible.builtin.stat:
        path: "/var/backups/kube-do/rollback/{{ kube_do_rollback_to_build }}.tar.gz"
      register: kube_do_rollback_bundle

    - name: Assert that the rollback archive exists
      ansible.builtin.assert:
        that:
          - kube_do_rollback_bundle.stat.exists
        fail_msg: >-
          rollback archive /var/backups/kube-do/rollback/{{ kube_do_rollback_to_build }}.tar.gz
          is missing on {{ inventory_hostname }}; rollback requires the archive created by
          the matching upgrade

    - name: Stop kubelet before restoring control-plane files
      ansible.builtin.systemd:
        name: kubelet
        state: stopped
      failed_when: false

    - name: Restore the previous Kubernetes configuration
      ansible.builtin.unarchive:
        src: "/var/backups/kube-do/rollback/{{ kube_do_rollback_to_build }}.tar.gz"
        dest: /
        remote_src: true
        extra_opts:
          - --overwrite

  roles:
    - role: containerd
      tags: [containerd]
    - role: kubernetes
      tags: [kubernetes]

- name: Stage the pre-upgrade etcd snapshot on every control-plane node
  hosts: control_plane
  gather_facts: false
  any_errors_fatal: true
  vars:
    kube_do_etcd_restore_dir: /var/backups/kube-do/etcd-restore
  tasks:
    - name: Create the etcd restore staging directory
      ansible.builtin.file:
        path: "{{ kube_do_etcd_restore_dir }}"
        state: directory
        mode: '0700'

    - name: Copy the pre-upgrade snapshot
      ansible.builtin.copy:
        src: "{{ kube_do_rollback_snapshot }}"
        dest: "{{ kube_do_etcd_restore_dir }}/{{ kube_do_rollback_snapshot | basename }}"
        mode: '0600'

    - name: Verify the staged snapshot
      ansible.builtin.stat:
        path: "{{ kube_do_etcd_restore_dir }}/{{ kube_do_rollback_snapshot | basename }}"
        checksum_algorithm: sha256
      register: kube_do_rollback_snapshot_stat

    - name: Assert the staged snapshot matches the requested snapshot
      ansible.builtin.assert:
        that:
          - kube_do_rollback_snapshot_stat.stat.size == (kube_do_rollback_snapshot_size | int)
          - kube_do_rollback_snapshot_stat.stat.checksum | lower == kube_do_rollback_snapshot_sha256 | lower
        fail_msg: "staged rollback snapshot mismatch on {{ inventory_hostname }}"

    - name: Restore the etcd data directory
      ansible.builtin.include_tasks: tasks/etcd-restore-data.yml
      vars:
        kube_do_etcd_restore_snapshot: "{{ kube_do_etcd_restore_dir }}/{{ kube_do_rollback_snapshot | basename }}"
        kube_do_etcd_restore_initial_cluster: "{{ kube_do_rollback_initial_cluster }}"
        kube_do_etcd_restore_timestamp: "{{ kube_do_rollback_timestamp }}"

- name: Start the first control-plane node
  hosts: control_plane[0]
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Start kubelet on the first control-plane node
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: true

- name: Start the remaining control-plane nodes
  hosts: control_plane[1:]
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Start kubelet on the control-plane node
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: true

- name: Wait for the restored control plane
  hosts: control_plane[0]
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for the Kubernetes API after rollback
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - --request-timeout=10s
          - get
          - --raw=/readyz
      register: kube_do_rollback_readyz
      changed_when: false
      retries: 120
      delay: 5
      until: kube_do_rollback_readyz.rc == 0

- name: Restart the restored control-plane static containers
  hosts: control_plane
  serial: 1
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Restart Kubernetes control-plane containers
      ansible.builtin.include_tasks: tasks/restart-restored-control-plane.yml

- name: Reinitialize kubelet on the control-plane nodes
  hosts: control_plane
  serial: 1
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Restart kubelet after the restored API is ready
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: true
      failed_when: false

- name: Start kubelet on worker nodes
  hosts: workers
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Start kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: true
        daemon_reload: true

- name: Restore Cilium
  hosts: control_plane[0]
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: cilium
      tags: [cilium]

- name: Reconcile restored cluster state
  hosts: control_plane[0]
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Rebuild Cilium and restart cluster add-ons
      ansible.builtin.include_tasks: tasks/reconcile-restored-addons.yml

    - name: Verify every etcd member is healthy after rollback
      ansible.builtin.include_tasks: tasks/etcd-endpoint-health.yml

- name: Verify the rolled back cluster
  hosts: control_plane[0]
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: verify
      tags: [verify]
