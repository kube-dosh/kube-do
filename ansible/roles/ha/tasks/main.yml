---
- name: Assert that the HA Artifacts exist in the Resource Manifest
  ansible.builtin.assert:
    that:
      - binaries | selectattr('name', 'equalto', 'haproxy') | list | length == 0
      - binaries | selectattr('name', 'equalto', 'keepalived') | list | length == 0
      - installer_binaries | selectattr('name', 'equalto', 'haproxy') | list | length == 1
      - installer_binaries | selectattr('name', 'equalto', 'keepalived') | list | length == 1
      - installer_images | selectattr('name', 'equalto', 'haproxy') | list | length == 1
      - installer_images | selectattr('name', 'equalto', 'keepalived') | list | length == 1
    fail_msg: "The Build must provide HAProxy and keepalived as Installer images, not node binaries"

- name: Resolve HA Artifacts
  ansible.builtin.set_fact:
    kubedo_haproxy_image: "{{ installer_images | selectattr('name', 'equalto', 'haproxy') | first }}"
    kubedo_keepalived_image: "{{ installer_images | selectattr('name', 'equalto', 'keepalived') | first }}"

- name: Assert that ctr is available for the HA containers
  ansible.builtin.command: /usr/local/bin/ctr --version
  changed_when: false

- name: Determine the interface that owns the node address
  ansible.builtin.command: "ip -o -4 addr show to {{ kubedo_node_ip }}"
  register: kubedo_node_interface_addr
  changed_when: false

- name: Assert that the node address maps to exactly one non-loopback interface
  ansible.builtin.assert:
    that:
      - kubedo_node_interface_addr.stdout_lines | length == 1
      - kubedo_node_interface_addr.stdout is search('\\binet\\s+' ~ (kubedo_node_ip | regex_escape) ~ '/')
      - (kubedo_node_interface_addr.stdout | regex_search('^\\d+:\\s+(\\S+)', '\\1') | first) != 'lo'
    fail_msg: >-
      The node address {{ kubedo_node_ip }} must be assigned exactly once to a
      non-loopback interface; found: {{ kubedo_node_interface_addr.stdout | default('nothing') }}

- name: Record VIP networking facts
  ansible.builtin.set_fact:
    kubedo_vip_interface: "{{ kubedo_node_interface_addr.stdout | regex_search('^\\d+:\\s+(\\S+)', '\\1') | first }}"
    kubedo_vip_prefix: "{{ kubedo_node_interface_addr.stdout | regex_search('inet\\s+[0-9.]+/(\\d+)', '\\1') | first }}"
    kubedo_vrrp_priority: "{{ 200 - (groups['control_plane'].index(inventory_hostname) | int) }}"

- name: Create HA configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/haproxy
    - /etc/keepalived
    - /run/haproxy
    - /run/keepalived
    - /var/log/kubedo
    - /usr/local/libexec

- name: Install the HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
  notify: Restart HAProxy

- name: Install the HAProxy container launcher
  ansible.builtin.template:
    src: kubedo-haproxy.sh.j2
    dest: /usr/local/libexec/kubedo-haproxy
    mode: '0755'
  notify: Restart HAProxy

- name: Install the HAProxy container systemd unit
  ansible.builtin.template:
    src: kubedo-haproxy.service.j2
    dest: /etc/systemd/system/kubedo-haproxy.service
    mode: '0644'
  notify:
    - Reload HA units
    - Restart HAProxy

- name: Pull the HAProxy Installer image
  ansible.builtin.command:
    argv:
      - /usr/local/bin/ctr
      - --namespace
      - kubedo
      - images
      - pull
      - --hosts-dir
      - /etc/containerd/certs.d
      - "{{ kubedo_haproxy_image.target }}"
  changed_when: false

- name: Validate the HAProxy configuration in its container
  ansible.builtin.command:
    argv:
      - /usr/local/bin/ctr
      - --namespace
      - kubedo
      - run
      - --rm
      - --net-host
      - --mount
      - type=bind,src=/etc/haproxy,dst=/etc/haproxy,options=rbind:ro
      - "{{ kubedo_haproxy_image.target }}"
      - haproxy-validate
      - /usr/local/sbin/haproxy
      - -c
      - -f
      - /etc/haproxy/haproxy.cfg
  changed_when: false

- name: Stop and disable legacy host HA services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - haproxy
    - keepalived
  failed_when: false

- name: Remove legacy host HA binaries, units, and caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/haproxy.service
    - /etc/systemd/system/keepalived.service
    - /usr/local/sbin/haproxy
    - /usr/local/sbin/keepalived
    - /usr/local/bin/kubedo-check-haproxy
    - /run/haproxy.pid
    - /run/keepalived.pid
    - /var/cache/kubedo/haproxy
    - /var/cache/kubedo/haproxy.sha256
    - /var/cache/kubedo/keepalived
    - /var/cache/kubedo/keepalived.sha256
  notify: Reload HA units

- name: Enable and start the HAProxy container
  ansible.builtin.systemd:
    name: kubedo-haproxy
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending HAProxy changes before keepalived starts tracking it
  ansible.builtin.meta: flush_handlers

- name: Wait for the HAProxy container task
  ansible.builtin.command: /usr/local/bin/ctr --namespace kubedo tasks ps haproxy
  register: kubedo_haproxy_task
  changed_when: false
  until: kubedo_haproxy_task.rc == 0
  retries: 20
  delay: 2

- name: Install the keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: '0644'
  notify: Restart keepalived

- name: Install the keepalived container launcher
  ansible.builtin.template:
    src: kubedo-keepalived.sh.j2
    dest: /usr/local/libexec/kubedo-keepalived
    mode: '0755'
  notify: Restart keepalived

- name: Install the keepalived container systemd unit
  ansible.builtin.template:
    src: kubedo-keepalived.service.j2
    dest: /etc/systemd/system/kubedo-keepalived.service
    mode: '0644'
  notify:
    - Reload HA units
    - Restart keepalived

- name: Apply pending keepalived changes before its container starts
  ansible.builtin.meta: flush_handlers

- name: Enable and start the keepalived container
  ansible.builtin.systemd:
    name: kubedo-keepalived
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the keepalived container task
  ansible.builtin.command: /usr/local/bin/ctr --namespace kubedo tasks ps keepalived
  register: kubedo_keepalived_task
  changed_when: false
  until: kubedo_keepalived_task.rc == 0
  retries: 20
  delay: 2

- name: Wait for the VIP to appear on the elected node
  ansible.builtin.command: "ip -o -4 addr show dev {{ kubedo_vip_interface }}"
  register: kubedo_vip_state
  changed_when: false
  until: control_plane_vip in kubedo_vip_state.stdout
  retries: 20
  delay: 2
  when: inventory_hostname == groups['control_plane'][0]

