---
- name: Check whether this node has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kube_do_kubelet_conf

- name: Check for an incomplete previous join
  ansible.builtin.stat:
    path: /etc/kubernetes/bootstrap-kubelet.conf
  register: kube_do_bootstrap_kubelet_conf

- name: Reset an incomplete previous join before retrying
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubeadm
      - reset
      - --force
      - --cri-socket
      - unix:///run/containerd/containerd.sock
  when:
    - not kube_do_kubelet_conf.stat.exists
    - kube_do_bootstrap_kubelet_conf.stat.exists

- name: Assert that the first control-plane node published a join command
  ansible.builtin.assert:
    that:
      - hostvars[groups['control_plane'][0]].kubeadm_join_command is defined
    fail_msg: "The kubeadm init role did not publish join data"
  when: not kube_do_kubelet_conf.stat.exists

- name: Assert that the first control-plane node published a certificate key
  ansible.builtin.assert:
    that:
      - hostvars[groups['control_plane'][0]].kubeadm_certificate_key is defined
    fail_msg: "The kubeadm init role did not publish the control-plane certificate key"
  when:
    - not kube_do_kubelet_conf.stat.exists
    - join_control_plane | default(false) | bool

- name: Join a control-plane node
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - >-
        {{ hostvars[groups['control_plane'][0]].kubeadm_join_command.stdout }}
        --control-plane
        --certificate-key {{ hostvars[groups['control_plane'][0]].kubeadm_certificate_key }}
        --cri-socket unix:///run/containerd/containerd.sock
        --apiserver-advertise-address {{ kube_do_node_ip }}
        --node-name {{ inventory_hostname }}
  when:
    - not kube_do_kubelet_conf.stat.exists
    - join_control_plane | bool
  register: kube_do_control_plane_join
  retries: "{{ kube_do_bootstrap_join_retries }}"
  delay: "{{ kube_do_bootstrap_join_delay }}"
  until: >-
    kube_do_control_plane_join.rc == 0 or
    'could not find a JWS signature' not in (kube_do_control_plane_join.stderr | default(''))

- name: Join a worker node
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - >-
        {{ hostvars[groups['control_plane'][0]].kubeadm_join_command.stdout }}
        --cri-socket unix:///run/containerd/containerd.sock
        --node-name {{ inventory_hostname }}
  when:
    - not kube_do_kubelet_conf.stat.exists
    - not join_control_plane | bool
  register: kube_do_worker_join
  retries: "{{ kube_do_bootstrap_join_retries }}"
  delay: "{{ kube_do_bootstrap_join_delay }}"
  until: >-
    kube_do_worker_join.rc == 0 or
    'could not find a JWS signature' not in (kube_do_worker_join.stderr | default(''))

- name: Ensure kubelet is running after join
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true
    daemon_reload: "{{ kube_do_systemd_daemon_reload }}"

