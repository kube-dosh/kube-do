---
- name: Assert a supported target platform
  ansible.builtin.assert:
    that:
      - platform_os_family in ['rhel', 'debian']
      - platform_arch in ['amd64', 'arm64']
      - (platform_arch == 'amd64' and ansible_facts.architecture == 'x86_64') or
        (platform_arch == 'arm64' and ansible_facts.architecture == 'aarch64')
      - (platform_os_family == 'rhel' and ansible_facts.os_family == 'RedHat' and
         ((ansible_facts.distribution == 'Fedora' and ansible_facts.distribution_major_version | int == 44) or
          (ansible_facts.distribution != 'Fedora' and ansible_facts.distribution_major_version | int == 9))) or
        (platform_os_family == 'debian' and ansible_facts.os_family == 'Debian' and
          ((ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int in [12, 13]) or
           (ansible_facts.distribution == 'Ubuntu' and
            (ansible_facts.distribution_version is match('^22[.]04([.]|$)') or ansible_facts.distribution_version is match('^24[.]04([.]|$)')))))
    fail_msg: >-
      kube-do supports RHEL-family 9, Fedora 44, Debian 12/13 and Ubuntu 22.04/24.04 on
      amd64 or arm64 only; got {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }} {{ ansible_facts.architecture }}
      while cluster.yaml requests {{ platform_os_family }}/{{ platform_arch }}

- name: Select the root filesystem
  ansible.builtin.set_fact:
    kube_do_root_filesystem: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first }}"
    kube_do_root_total_gib: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/') | first).size_total | int / 1073741824 | round(1) }}"
    kube_do_root_available_gib: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/') | first).size_available | int / 1073741824 | round(1) }}"

- name: Assert minimum root filesystem capacity
  ansible.builtin.assert:
    that:
      - kube_do_root_filesystem.size_total | int >= kube_do_min_root_total_bytes
      - kube_do_root_filesystem.size_available | int >= kube_do_min_root_available_bytes
    fail_msg: >-
      the root filesystem has {{ kube_do_root_total_gib }} GiB total and
      {{ kube_do_root_available_gib }} GiB available; Kubernetes control-plane
      storage and container images require at least 20 GiB total and 5 GiB
      available. Resize the virtual disk and guest filesystem before installing.

- name: Warn about the recommended root filesystem capacity
  ansible.builtin.debug:
    msg: >-
      WARNING: the root filesystem has {{ kube_do_root_total_gib }} GiB total;
      kube-do recommends provisioning at least a 50 GiB disk for control-plane
      nodes (about 49 GiB usable filesystem) because etcd, container images and
      logs share this filesystem.
  when: kube_do_root_filesystem.size_total | int < kube_do_recommended_root_total_bytes

- name: Ensure kubelet can read a resolver configuration
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Generated by kube-do because the image had no resolver configuration.
      # This file intentionally has no nameservers; CoreDNS omits forward when
      # the target host has no usable upstream resolver.
    force: false
    mode: '0644'

- name: Disable and verify swap
  ansible.builtin.import_tasks: swap.yml

- name: Install kernel module configuration
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kube-do.conf
    mode: '0644'
    content: |
      overlay
      br_netfilter

- name: Load required kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Install Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kube-do.conf
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop and disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when:
    - platform_os_family == 'rhel'
    - "'firewalld.service' in ansible_facts.services"

- name: Inspect the Debian-family firewall command
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: kube_do_ufw
  when: platform_os_family == 'debian'

- name: Disable ufw
  ansible.builtin.command: ufw --force disable
  when:
    - platform_os_family == 'debian'
    - kube_do_ufw.stat is defined and kube_do_ufw.stat.exists
  changed_when: true

- name: Stop and disable the ufw service
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false
  when:
    - platform_os_family == 'debian'
    - "'ufw.service' in ansible_facts.services"

- name: Inspect SELinux configuration
  ansible.builtin.stat:
    path: /etc/selinux/config
  register: kube_do_selinux_config
  when: platform_os_family == 'rhel'

- name: Disable SELinux persistently
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=disabled'
  when:
    - platform_os_family == 'rhel'
    - kube_do_selinux_config.stat.exists
  register: kube_do_selinux_changed

- name: Read current SELinux mode
  ansible.builtin.command: getenforce
  register: kube_do_selinux_mode
  changed_when: false
  failed_when: false
  when: platform_os_family == 'rhel'

- name: Put SELinux into permissive mode for this boot
  ansible.builtin.command: setenforce 0
  when:
    - platform_os_family == 'rhel'
    - kube_do_selinux_mode.stdout == 'Enforcing'
  changed_when: true
  failed_when: false

- name: Show the required manual reboot
  ansible.builtin.debug:
    msg: >-
      SELinux is configured as disabled. A reboot is required before the next
      boot is fully compliant. kube-do never reboots nodes automatically.
  when:
    - platform_os_family == 'rhel'
    - (kube_do_selinux_changed is defined and kube_do_selinux_changed is changed) or
      (kube_do_selinux_mode.stdout | default('') in ['Enforcing', 'Permissive'])

