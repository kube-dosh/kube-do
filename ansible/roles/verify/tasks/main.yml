---
- name: Wait for every node to become Ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - wait
      - --for=condition=Ready
      - nodes
      - --all
      - --timeout=10m
  changed_when: false

- name: Wait for the Cilium operator
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - rollout
      - status
      - deployment/cilium-operator
      - --timeout=10m
  changed_when: false

- name: Wait for CoreDNS
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - rollout
      - status
      - deployment/coredns
      - --timeout=10m
  changed_when: false

- name: Wait for the Hubble relay
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - rollout
      - status
      - deployment/hubble-relay
      - --timeout=10m
  changed_when: false

- name: Verify kube-proxy is absent
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - get
      - daemonset
      - kube-proxy
      - --ignore-not-found
      - -o
      - name
  register: kubedo_kube_proxy
  changed_when: false
  failed_when: false

- name: Assert the cluster uses kube-proxy replacement
  ansible.builtin.assert:
    that:
      - kubedo_kube_proxy.rc == 0
      - kubedo_kube_proxy.stdout | trim == ''
    fail_msg: >-
      kube-proxy lookup failed or kube-proxy exists even though this Build uses
      Cilium kube-proxy replacement (rc={{ kubedo_kube_proxy.rc }}, stdout={{
      kubedo_kube_proxy.stdout | trim }})

- name: Show cluster status
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - nodes
      - -o
      - wide
  register: kubedo_cluster_status
  changed_when: false

- name: Print cluster status
  ansible.builtin.debug:
    var: kubedo_cluster_status.stdout_lines

