---
- name: Wait for every node to become Ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - wait
      - --for=condition=Ready
      - nodes
      - --all
      - "--timeout={{ kube_do_node_ready_timeout }}"
  changed_when: false

- name: Wait for the Cilium operator
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - rollout
      - status
      - deployment/cilium-operator
      - "--timeout={{ kube_do_cilium_operator_rollout_timeout }}"
  changed_when: false

- name: Wait for CoreDNS
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - rollout
      - status
      - deployment/coredns
      - --watch=false
      - "--timeout={{ kube_do_coredns_rollout_timeout }}"
  register: kube_do_coredns_rollout
  changed_when: false
  retries: "{{ kube_do_coredns_rollout_retries }}"
  delay: "{{ kube_do_coredns_rollout_delay }}"
  until: kube_do_coredns_rollout.rc == 0

- name: Wait for the Hubble relay
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - rollout
      - status
      - deployment/hubble-relay
      - --watch=false
      - "--timeout={{ kube_do_hubble_rollout_timeout }}"
  register: kube_do_hubble_rollout
  changed_when: false
  retries: "{{ kube_do_hubble_rollout_retries }}"
  delay: "{{ kube_do_hubble_rollout_delay }}"
  until: kube_do_hubble_rollout.rc == 0

- name: Verify kube-proxy is absent
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --namespace
      - kube-system
      - get
      - daemonset
      - kube-proxy
      - --ignore-not-found
      - -o
      - name
  register: kube_do_kube_proxy
  changed_when: false
  failed_when: false

- name: Assert the cluster uses kube-proxy replacement
  ansible.builtin.assert:
    that:
      - kube_do_kube_proxy.rc == 0
      - kube_do_kube_proxy.stdout | trim == ''
    fail_msg: >-
      kube-proxy lookup failed or kube-proxy exists even though this Build uses
      Cilium kube-proxy replacement (rc={{ kube_do_kube_proxy.rc }}, stdout={{
      kube_do_kube_proxy.stdout | trim }})

- name: Show cluster status
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - nodes
      - -o
      - wide
  register: kube_do_cluster_status
  changed_when: false

- name: Print cluster status
  ansible.builtin.debug:
    var: kube_do_cluster_status.stdout_lines

