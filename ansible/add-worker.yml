---
- name: Read worker join data from the existing cluster
  hosts: control_plane[0]
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Create a worker join command
      ansible.builtin.command: /usr/local/bin/kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false
      retries: 3
      delay: 5
      until: kubeadm_join_command.rc == 0

- name: Prepare new workers
  hosts: new_workers
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: prerequisites
      tags: [prerequisites]
    - role: containerd
      tags: [containerd]
    - role: kubernetes
      tags: [kubernetes]

- name: Join new workers
  hosts: new_workers
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: kubeadm_join
      vars:
        join_control_plane: false
      tags: [join, join-workers]

- name: Verify new workers
  hosts: control_plane[0]
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for new workers to become Ready
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - wait
          - --for=condition=Ready
          - "node/{{ item }}"
          - --timeout=10m
      loop: "{{ groups['new_workers'] }}"
      changed_when: false
